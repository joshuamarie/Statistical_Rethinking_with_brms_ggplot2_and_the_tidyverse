name: uvr test

on:
  push:
    branches: [ci-uvr-test]

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter: ["index", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15"]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - name: Install uvr
        run: |
          curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | UVR_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install packages
        run: |
          uvr init --here
          uvr add --no-install rmarkdown knitr vembedr tidyverse patchwork brms tidybayes purrr ggrepel tigris bayesplot GGally rcartocolor broom posterior ggthemes scales ggmcmc ghibli wesanderson loo ggExtra cran/santoku@master invgamma ggbeeswarm viridis readxl MCMCglmm rmcelreath/rethinking hadley/emo gadenbuie/ggpomological edwinth/dutchmasters stan-dev/cmdstanr
          uvr sync --install-system-deps
      - name: Create fits folder
        run: mkdir -p fits
      - name: Render chapter
        run: quarto render ${{ matrix.chapter }}.qmd
      - name: Upload frozen output
        uses: actions/upload-artifact@v4
        with:
          name: freeze-${{ matrix.chapter }}
          path: _freeze/${{ matrix.chapter }}
          if-no-files-found: error

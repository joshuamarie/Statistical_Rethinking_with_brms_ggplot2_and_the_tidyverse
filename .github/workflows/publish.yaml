name: publish

on:
  push:
    branches: [master, fix-and-restructure-with-reformatting-and-ci-render]
  workflow_dispatch:

jobs:
  chapters:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: List chapters that contain R code
        id: list
        run: |
          matrix=$(yq -r '.book.chapters[] | select(tag == "!!str")' _quarto.yml | tr -d '\r' | while read -r file; do
            if grep -q '^```{r' "$file"; then
              echo "${file%.qmd}"
            fi
          done | jq -R . | jq -sc .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  render:
    needs: chapters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter: ${{ fromJSON(needs.chapters.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - name: Install uvr
        run: |
          for attempt in 1 2 3; do
            curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | UVR_INSTALL_DIR="$HOME/.local/bin" sh && break
            echo "uvr install failed, retrying in 30 seconds"
            sleep 30
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uvr" --version
      - name: Install packages
        run: |
          uvr init --here
          uvr add --no-install rmarkdown knitr vembedr tidyverse patchwork brms tidybayes purrr ggrepel tigris bayesplot GGally rcartocolor broom posterior ggthemes scales ggmcmc ghibli wesanderson "loo@<2.10.0" ggExtra cran/santoku@master invgamma ggbeeswarm viridis readxl MCMCglmm lwgeom rmcelreath/rethinking hadley/emo gadenbuie/ggpomological edwinth/dutchmasters stan-dev/cmdstanr
          uvr sync --install-system-deps
      - name: Create fits folder
        run: mkdir -p fits
      - name: Render chapter
        run: quarto render ${{ matrix.chapter }}.qmd
      - name: Upload frozen output
        uses: actions/upload-artifact@v4
        with:
          name: freeze-${{ matrix.chapter }}
          path: _freeze/${{ matrix.chapter }}
          if-no-files-found: error

  publish:
    needs: render
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - uses: actions/download-artifact@v4
        with:
          pattern: freeze-*
          path: _freeze
      - name: Put frozen output in place
        run: |
          for dir in _freeze/freeze-*; do
            mv "$dir" "_freeze/${dir#_freeze/freeze-}"
          done
          ls _freeze
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

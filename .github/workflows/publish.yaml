name: publish

on:
  push:
    branches: [master, fix-and-restructure-with-reformatting-and-ci-render]
  workflow_dispatch:

jobs:
  # Reads the chapter list from _quarto.yml, so new chapters are picked up automatically.
  chapters:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - name: Read the chapter list from _quarto.yml
        id: read
        run: |
          list=$(yq -o=json -I=0 '[.book.chapters[] | select(tag == "!!str") | sub("\.qmd$"; "")]' _quarto.yml)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  # One job per chapter, all in parallel. Each one runs the R code and keeps the computed output.
  render:
    needs: chapters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter: ${{ fromJSON(needs.chapters.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - name: Install uvr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | UVR_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvr init --here
          uvr add --no-install rmarkdown knitr vembedr tidyverse patchwork brms tidybayes purrr ggrepel tigris bayesplot GGally rcartocolor broom posterior ggthemes scales ggmcmc ghibli wesanderson "loo@<2.10.0" ggExtra cran/santoku@master invgamma ggbeeswarm viridis readxl MCMCglmm lwgeom rmcelreath/rethinking hadley/emo gadenbuie/ggpomological edwinth/dutchmasters stan-dev/cmdstanr
          uvr sync --install-system-deps
      - name: Create fits folder
        run: mkdir -p fits
      - name: Render chapter
        run: quarto render ${{ matrix.chapter }}.qmd
      - name: Upload frozen output
        uses: actions/upload-artifact@v4
        with:
          name: freeze-${{ matrix.chapter }}
          path: _freeze/${{ matrix.chapter }}
          if-no-files-found: ignore

  # Collects every chapter's output and publishes the book. No R code runs here.
  publish:
    needs: render
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - uses: actions/download-artifact@v4
        with:
          pattern: freeze-*
          path: _freeze
      - name: Put frozen output in place
        run: |
          for dir in _freeze/freeze-*; do
            mv "$dir" "_freeze/${dir#_freeze/freeze-}"
          done
          ls _freeze
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
